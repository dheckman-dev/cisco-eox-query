[tox]
requires =
    tox>=4
    tox-uv>=1
env_list =
    py311
    py312
    py313
    py314
skip_missing_interpreters = true

[testenv]
description = run unit tests with pytest under {base_python}
package = wheel
deps =
    pytest>=8.0
commands =
    pytest {posargs}

[testenv:lint]
description = run ruff linter and formatter
package = skip
skip_install = true
deps =
    ruff>=0.16.7
commands =
    ruff check .
    ruff format --check .
